# Apple Music プレイリストデータの再取得。
# Apple が毎週日曜に更新するのは Replay All Time と現行年リプレイのみ (過去年は凍結)
# のため、週次実行は --weekly でこの 2 本だけ取得する。fetchedAt 以外に変更がない週は
# スクリプトが書き込みをスキップするため PR は作られない。全件取得は workflow_dispatch
# の scope=all (年替わりで PLAYLISTS 配列を入れ替えた時など) か手動 pnpm fetch-playlists。
# Secrets に Apple Developer Program の
# APPLE_MUSIC_TEAM_ID / APPLE_MUSIC_KEY_ID / APPLE_MUSIC_PRIVATE_KEY が必要。
#
# GITHUB_TOKEN で作成した PR の CI (on: pull_request) は承認待ちになる。
# Files changed を確認後、Merge status の Approve workflows to run から required checks を開始する。
name: Refresh Apple Music Playlists

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "取得範囲。weekly = 週次更新される Replay All Time + 現行年のみ / all = 全プレイリスト (年替わり時など)"
        type: choice
        options:
          - weekly
          - all
        default: weekly
  schedule:
    # 毎週月曜 13:23 UTC (22:23 JST)。Apple の「日曜更新」のタイムゾーン基準が
    # 不明なため、全タイムゾーンで日曜が終了した後 (月曜 12:00 UTC 以降) に実行する
    - cron: "23 13 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false

      # fetch-playlists.mjs は astro/zod (node_modules) に依存するため install が必須
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch playlists
        env:
          APPLE_MUSIC_TEAM_ID: ${{ secrets.APPLE_MUSIC_TEAM_ID }}
          APPLE_MUSIC_KEY_ID: ${{ secrets.APPLE_MUSIC_KEY_ID }}
          APPLE_MUSIC_PRIVATE_KEY: ${{ secrets.APPLE_MUSIC_PRIVATE_KEY }}
          # schedule イベントでは inputs が空のため weekly に倒す
          FETCH_SCOPE: ${{ inputs.scope || 'weekly' }}
        run: |
          if [ "$FETCH_SCOPE" = "all" ]; then
            node scripts/fetch-playlists.mjs
          else
            node scripts/fetch-playlists.mjs --weekly
          fi

      - name: Create pull request if data changed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/playlists; then
            echo "プレイリストデータに変更はありません。"
            exit 0
          fi

          # 前回の refresh PR が未処理なら重複 PR を作らない。既存 PR を人間が
          # 確認・解消した後、次回 schedule または workflow_dispatch で再取得する。
          existing_pr="$(
            gh pr list \
              --state open \
              --base main \
              --limit 100 \
              --json url,author,headRefName,isCrossRepository \
              --jq '[.[] | select(.author.is_bot == true and .author.login == "app/github-actions" and .isCrossRepository == false and (.headRefName | test("^data/refresh-playlists-[0-9]+$")))][0].url // empty'
          )"
          if [[ -n "$existing_pr" ]]; then
            echo "::error::既存の Apple Music playlist refresh PR が未処理です: ${existing_pr}"
            exit 1
          fi

          branch="data/refresh-playlists-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/data/playlists
          git commit -m "chore: refresh Apple Music playlist data"
          git push -u origin "$branch"
          pr_url="$(
            gh pr create --base main --head "$branch" \
              --title "chore: refresh Apple Music playlist data" \
              --body "$(printf 'scripts/fetch-playlists.mjs による自動更新です。\n\nこの PR は github-actions[bot] が GITHUB_TOKEN で作成したため、required checks は承認待ちになります。Files changed を確認後、Merge status の Awaiting approval から Approve workflows to run を選択してください。close/reopen は不要です。')"
          )"
          echo "作成した PR: ${pr_url}"

          # review request で作成直後に通知する。通知に失敗しても PR 自体は有効なので、
          # 24 時間後の monitor に任せて workflow は失敗させない。
          if ! gh pr edit "$pr_url" --add-reviewer necofuryai; then
            echo "::warning::${pr_url} の review request に失敗しました。"
          fi

          {
            echo "### Apple Music playlist refresh PR"
            echo
            echo "- PR: ${pr_url}"
            echo "- 次の操作: Files changed を確認し、Approve workflows to run で required checks を開始する"
          } >> "$GITHUB_STEP_SUMMARY"
