# .claude/skills/ にベンダリングした cloudflare/skills (Apache-2.0) と上流の乖離を検出する。
# これらのスキルはプラグイン経由ではなく手動コピーのため上流更新が自動で降ってこず、放置すると
# 改変したファイル冒頭の変更告知と .claude/skills/README.md の「上流からの改変点」
# (Apache-2.0 第 4 条 (b)) が実態とずれる。
#
# 乖離には性質の異なる 2 種類があり、トリガーごとに扱いを変える:
# - pull_request (.claude/skills/、検査スクリプトとその定義、このワークフローを触った PR のみ):
#   ベンダリングファイルの改変は PR の責任なのでジョブを失敗させる。改変するなら
#   LOCALLY_MODIFIED への登録が要る、という強制。ファイル冒頭の変更告知は通信を要しないため、
#   必須チェックで走る単体テスト (tests/unit/vendored-skills-notice.test.mjs) が検査する。
#   README の「上流からの改変点」への記録は機械的に検査しないため、レビューで確認する。
# - schedule / workflow_dispatch: 上流更新は誰の PR の責任でもないため失敗させず、Issue に記録する。
#   Actions タブを恒常的に赤くせず、かつ通知メールのように流れて消えないようにするための選択。
#
# verify と report を分けているのは権限の分離のため。verify は pull_request でチェックアウトした
# ブランチのコードを実行するので書き込み権限を持たせない。report は issues: write を持つが、
# チェックアウトを一切行わずリポジトリのコードを実行しない。
name: Vendored skills drift

on:
  pull_request:
    paths:
      - ".claude/skills/**"
      - "scripts/diff-cloudflare-skills.mjs"
      - "scripts/cloudflare-skills-manifest.mjs"
      - ".github/workflows/skills-drift.yml"
  workflow_dispatch:
  schedule:
    # 毎週月曜 06:17 UTC (15:17 JST)。Refresh Apple Music Playlists (13:23 UTC) と時間帯をずらす
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.check.outputs.drift }}
      report: ${{ steps.check.outputs.report }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # diff-cloudflare-skills.mjs は Node 組み込みモジュールと fetch だけで動くため、
      # pnpm のセットアップも install も不要。pnpm を経由しないことで、このワークフローが
      # pnpm 本体やその setup アクションの更新の影響を受けなくなる。
      # 依存を足す場合は Setup pnpm と pnpm install --frozen-lockfile を戻すこと。
      #
      # スクリプトは「上流更新あり」だけを専用の終了コード 20 で報告する
      # (scripts/cloudflare-skills-manifest.mjs の EXIT_DRIFT)。それ以外の非 0 はすべて検査自体の
      # 失敗として扱い、Issue は立てずにジョブを失敗させる。Node は読み込み時のエラーや構文エラーも
      # 1 で報告するため、1 を「更新あり」に使うと、壊れたスクリプトが「更新あり」の Issue を立ててしまう。
      # この分類は tests/unit/skills-drift-workflow.test.mjs が、このステップの本文を取り出して実行し検査する。
      #
      # shell: bash は bash -e で起動し、set -uo pipefail では -e は外れない。
      # 素の report=$(...) だと非 0 終了の時点でステップが打ち切られ、レポートの出力も
      # 下の case による振り分けも行われない。そのため || で終了コードを受け取る。
      - name: Check for drift
        id: check
        shell: bash
        run: |
          set -uo pipefail
          script=scripts/diff-cloudflare-skills.mjs
          rc=0
          report=$(node "$script" 2>&1) || rc=$?
          echo "$report"
          case "$rc" in
            0) drift=false ;;
            20) drift=true ;;
            *)
              echo "::error::${script} による検査が失敗しました (終了コード ${rc})。"
              exit "$rc"
              ;;
          esac
          echo "drift=${drift}" >> "$GITHUB_OUTPUT"
          {
            echo "report<<DRIFT_REPORT_EOF"
            echo "$report"
            echo "DRIFT_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fail the pull request on drift
        if: github.event_name == 'pull_request' && steps.check.outputs.drift == 'true'
        run: |
          echo "::error::ベンダリングしたスキルが上流と乖離しています。改変が意図的なら scripts/cloudflare-skills-manifest.mjs の LOCALLY_MODIFIED に登録し、改変したファイルの冒頭 (frontmatter があればその直後) に変更告知を置いたうえで、.claude/skills/README.md の「上流からの改変点」に追記してください。"
          exit 1

  # 週次実行で上流更新を見つけた場合の記録係。チェックアウトしないので
  # issues: write を持った状態でリポジトリのコードが動くことはない。
  report:
    needs: verify
    if: github.event_name != 'pull_request' && needs.verify.outputs.drift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # 同じ内容で毎週 Issue が増えないよう、未クローズのものがあればコメントを足すだけにする
      - name: Report upstream drift as an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "chore: cloudflare/skills の上流更新を取り込む"
          REPORT: ${{ needs.verify.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # The Markdown code fence must remain literal, so the format string is
          # intentionally single-quoted instead of allowing command substitution.
          # shellcheck disable=SC2016
          body=$(printf '%s\n\n```\n%s\n```\n\n%s\n\n%s\n' \
            "[cloudflare/skills](https://github.com/cloudflare/skills) に \`.claude/skills/\` へ未反映の更新があります。" \
            "$REPORT" \
            "取り込む手順は \`.claude/skills/README.md\` の「上流への再同期」を参照してください。差分本文は \`pnpm diff-skills --diff\` で確認できます。ローカル改変済みの 2 ファイルは上流更新が「改変」表示に埋もれるため、目視での確認が要ります。" \
            "実行ログ: ${RUN_URL}")
          existing=$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "既存の Issue #${existing} にコメントしました。"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
