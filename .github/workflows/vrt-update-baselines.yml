name: Generate VRT baseline candidates

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA to render
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host
    steps:
      - name: Validate requested commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout selected revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      # GitHub serves any fork-network object by SHA, so reject commits that
      # are not reachable from a branch of this repository before running
      # install or build from the checked-out revision.
      - name: Verify commit belongs to this repository
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          [[ -n "$(git branch -r --contains "$REQUESTED_SHA")" ]]

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Generate candidates
        shell: bash
        run: |
          set -euo pipefail
          pnpm test:vrt --update-snapshots
          git status --short --untracked-files=all -- \
            tests/vrt/__screenshots__/ > "$RUNNER_TEMP/vrt-baseline-manifest.txt"

      - name: Upload candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-baseline-candidates-${{ github.run_id }}
          path: |
            tests/vrt/__screenshots__/
            ${{ runner.temp }}/vrt-baseline-manifest.txt
          if-no-files-found: error
          retention-days: 7
