name: Build and Check

on:
  push:
    branches: [ main ] # Adjust branches as needed
  pull_request:
    branches: [ main ] # Adjust branches as needed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Astro Check
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false # Disable auto-install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate peer dependency compatibility
        shell: bash
        run: |
          set -euo pipefail
          validation_dir="$(mktemp -d)"
          trap 'rm -rf "$validation_dir"' EXIT
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml "$validation_dir/"
          cd "$validation_dir"
          pnpm peers check --lockfile-only

      - name: Run Astro Check
        run: pnpm astro check

      - name: Run Type Check
        run: pnpm type-check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Astro Build
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false # Disable auto-install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Production Build
        run: pnpm build

      - name: Smoke test stable routes
        shell: bash
        run: |
          set -euo pipefail

          pnpm astro preview --host 127.0.0.1 --port 4321 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          curl --fail --silent --show-error \
            --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:4321/ > /dev/null

          for route in / /about/ /archive/ /robots.txt /rss.xml; do
            curl --fail --silent --show-error \
              "http://127.0.0.1:4321${route}" > /dev/null
          done

          test -f dist/pagefind/pagefind.js

  ui-smoke:
    name: UI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: pnpm build

      - name: Run semantic UI checks
        id: ui
        run: pnpm test:ui

      - name: Upload UI failure evidence
        if: failure() && steps.ui.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-smoke-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  ci-scripts:
    name: CI script unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI script unit tests
        run: node --test scripts/ci/*.test.mjs

      - name: Run unit tests
        run: pnpm test:unit

  # Aggregate job so branch protection only needs a single required check name
  ci-ok:
    name: CI OK
    if: always()
    needs: [ check, build, ui-smoke, ci-scripts ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to succeed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          UI_RESULT: ${{ needs.ui-smoke.result }}
          SCRIPTS_RESULT: ${{ needs.ci-scripts.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHECK_RESULT" = "success"
          test "$SCRIPTS_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
          test "$UI_RESULT" = "success"
