version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
      include:
        - "*"
    labels:
      - "dependencies"
    assignees:
      - "necofuryai"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      astro-svelte:
        applies-to: "version-updates"
        patterns:
          - "astro"
          - "@astrojs/svelte"
          - "svelte"
        update-types:
          - "minor"
          - "patch"
      expressive-code:
        applies-to: "version-updates"
        patterns:
          - "@expressive-code/*"
          - "astro-expressive-code"
        update-types:
          - "minor"
          - "patch"
      tailwind-css:
        applies-to: "version-updates"
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"
      type-definitions:
        applies-to: "version-updates"
        patterns:
          - "@types/*"
        update-types:
          - "minor"
      # 上記グループに該当しない minor/patch の受け皿。同時に open になる
      # lockfile PR の数を減らし、テストマージ由来の lockfile 重複キー破損
      # (AGENTS.md の「Dependencies」参照) の発生機会を抑える。major は個別 PR のまま。
      # @playwright/test は build.yml の container image と対で更新する必要があり、
      # group に載せると無関係な更新を CI failure に巻き込むため個別 PR に分離する
      # (docs/dependency-update-automation-plan.md の 2026-08-03 改訂を参照)。
      catch-all-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "@playwright/test"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:30"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      include:
        - "*"
    labels:
      - "dependencies"
      - "github-actions"
    assignees:
      - "necofuryai"
    commit-message:
      prefix: "chore(actions)"
