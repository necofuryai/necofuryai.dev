version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
      include:
        - "*"
    labels:
      - "dependencies"
    assignees:
      - "necofuryai"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      astro-svelte:
        applies-to: "version-updates"
        patterns:
          - "astro"
          - "@astrojs/svelte"
          - "svelte"
        update-types:
          - "minor"
          - "patch"
      expressive-code:
        applies-to: "version-updates"
        patterns:
          - "@expressive-code/*"
          - "astro-expressive-code"
        update-types:
          - "minor"
          - "patch"
      tailwind-css:
        applies-to: "version-updates"
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"
      type-definitions:
        applies-to: "version-updates"
        patterns:
          - "@types/*"
        update-types:
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:30"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      include:
        - "*"
    labels:
      - "dependencies"
      - "github-actions"
    assignees:
      - "necofuryai"
    commit-message:
      prefix: "chore(actions)"
