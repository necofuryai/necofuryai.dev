allowBuilds:
  esbuild: true
  swup: false

# Keep pnpm-lock.yaml a single YAML document. With a pnpm 12 packageManager
# pin, pnpm otherwise prepends an env lockfile document, and GitHub's
# dependency graph reads only that first document, so every npm dependency
# would drop out of the graph, Dependabot alerts, and Dependency Review
# (https://github.com/dependabot/dependabot-core/issues/15904).
# pnpm then no longer switches to the pinned version by itself; see AGENTS.md.
pmOnFail: ignore

# audit.ignore: http-cache-semantics (via astro) is unreachable at build time and
# disputed upstream; see AGENTS.md. Remove the entry once the advisory is withdrawn
# or a release fixes it. Keep these comments above the `audit:` key: `pnpm audit
# --ignore` re-renders the `ignore:` block and drops any comment inside it.
audit:
  ignore:
    - GHSA-ch52-4w7c-c8xp

overrides:
  axios: ">=1.18.1"
  form-data: ">=4.0.6"
  follow-redirects: ">=1.16.0"
  tar: "^7.5.21"
  "rollup@<2.80.0": "2.80.0"
  "serialize-javascript@<7.0.5": "7.0.5"
  "@swup/plugin@<4": "^4.0.0"
  "undici@<6.28.0": "^6.28.0"
  "postcss@<8.5.23": "^8.5.23"
  "nanoid@<3.3.17": "^3.3.17"
  "fast-uri@>=3.0.0 <3.1.8": "^3.1.8"
  "katex@<0.18.2": "^0.19.0"
  "postcss-selector-parser@<7.1.6": "^7.1.6"
